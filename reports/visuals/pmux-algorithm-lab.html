}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    #pmux-lab-root .lab-before-after-arrow {

            &lt;div class=&quot;lab-stack&quot;&gt;
              &lt;div class=&quot;lab-flow&quot;&gt;&lt;span class=&quot;lab-node is-source&quot;&gt;数据 A&lt;/span&gt;&lt;span class=&quot;lab-arrow&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;lab-node&quot;&gt;PMUX A&lt;/span&gt;&lt;/div&gt;

          &lt;p class=&quot;rule-copy text-muted&quot;&gt;寄存器大部分时候保持原值，只在少数条件下更新。如果更新值能证明就是总线上的某些位，就把整块选择器折叠成连线；有另一路有效值时再保留一个小 MUX。&lt;/p&gt;
          &lt;div class=&quot;rule-facts&quot;&gt;&lt;span class=&quot;viz-badge&quot;&gt;test3 命中 3 处&lt;/span&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;只处理能逐位证明为总线位的情况&lt;/span&gt;&lt;/div&gt;

            &lt;div class=&quot;lab-flow&quot;&gt;&lt;span class=&quot;lab-node is-source&quot;&gt;局部更新&lt;/span&gt;&lt;span class=&quot;lab-arrow&quot;&gt;↗&lt;/span&gt;&lt;/div&gt;

            &lt;div class=&quot;lab-flow&quot;&gt;&lt;span class=&quot;lab-node is-muted&quot;&gt;非空 A 端&lt;/span&gt;&lt;span class=&quot;lab-arrow&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;lab-node&quot;&gt;单个小 MUX&lt;/span&gt;&lt;/div&gt;

          &lt;p class=&quot;rule-copy text-muted&quot;&gt;如果寄存器使能已经保证总线某一位固定不变，那么比较器不必再重复检查这一位。只有整条扇出都能证明时才缩窄，遇到未知负载就放弃。&lt;/p&gt;

          &lt;/div&gt;

            &lt;div class=&quot;lab-flow&quot;&gt;&lt;span class=&quot;lab-node is-source&quot;&gt;可观察位&lt;/span&gt;&lt;span class=&quot;lab-arrow&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;lab-node is-hot&quot;&gt;6 位比较&lt;/span&gt;&lt;span class=&quot;lab-arrow&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;lab-node&quot;&gt;使能寄存器&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;lab-flow&quot;&gt;&lt;span class=&quot;lab-node is-muted&quot;&gt;2 位已由使能确定&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;

    &lt;div class=&quot;lab-rule-panel&quot; data-rule=&quot;5&quot; hidden&gt;
      &lt;div class=&quot;rule-stage&quot;&gt;
        &lt;div&gt;
          &lt;div class=&quot;rule-kicker text-small text-muted&quot;&gt;06 / 08 · 相邻常量&lt;/div&gt;
          &lt;h3&gt;相邻常量码共因子&lt;/h3&gt;
          &lt;p class=&quot;rule-copy text-muted&quot;&gt;两个条件只差最低位时，完整比较两遍很浪费。先算共同高位，再用差分位选择结果，控制逻辑更短。&lt;/p&gt;
          &lt;div class=&quot;rule-facts&quot;&gt;&lt;span class=&quot;viz-badge&quot;&gt;test3 命中 1 对&lt;/span&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;只处理普通 eq，不碰带 X 语义的 eqx&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;before-after&quot;&gt;

            &lt;div class=&quot;lab-flow&quot;&gt;&lt;span class=&quot;lab-node is-source&quot;&gt;总线&lt;/span&gt;&lt;span class=&quot;lab-arrow&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;lab-node is-hot&quot;&gt;共同前缀&lt;/span&gt;&lt;span class=&quot;lab-arrow&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;lab-node&quot;&gt;最低位选择&lt;/span&gt;&lt;/div&gt;

        parts.push(&#x27;&lt;text class=&quot;chart-muted&quot; x=&quot;&#x27; + x.toFixed(1) + &#x27;&quot; y=&quot;&#x27; + (height - 8) + &#x27;&quot; text-anchor=&quot;middle&quot;&gt;&#x27; + tick + &#x27;&lt;/text&gt;&#x27;);
      });

      officialRows.forEach(function (row, index) {
        var y = top + index * rowHeight;
        var baselineWidth = (row.baseline / maxValue) * plotWidth;
        var candidateWidth = (row.candidate / maxValue) * plotWidth;
        var textY = y + 12;
        var barY = y + 20;
        var countText = row.baseline + &#x27; → &#x27; + row.candidate;
        var reductionText = &#x27;−&#x27; + row.reduction.toFixed(2) + &#x27;%&#x27;;

        parts.push(&#x27;&lt;text class=&quot;chart-muted&quot; x=&quot;0&quot; y=&quot;&#x27; + textY + &#x27;&quot;&gt;&#x27; + row.name + &#x27;&lt;/text&gt;&#x27;);
        parts.push(&#x27;&lt;text x=&quot;&#x27; + left + &#x27;&quot; y=&quot;&#x27; + textY + &#x27;&quot;&gt;&#x27; + countText + &#x27;&lt;/text&gt;&#x27;);
        parts.push(&#x27;&lt;text x=&quot;&#x27; + width + &#x27;&quot; y=&quot;&#x27; + textY + &#x27;&quot; text-anchor=&quot;end&quot;&gt;&#x27; + reductionText + &#x27;&lt;/text&gt;&#x27;);
        parts.push(&#x27;&lt;rect class=&quot;chart-track&quot; x=&quot;&#x27; + left + &#x27;&quot; y=&quot;&#x27; + barY + &#x27;&quot; width=&quot;&#x27; + baselineWidth.toFixed(1) + &#x27;&quot; height=&quot;8&quot; rx=&quot;4&quot;&gt;&lt;/rect&gt;&#x27;);
        parts.push(&#x27;&lt;rect class=&quot;chart-fill&quot; x=&quot;&#x27; + left + &#x27;&quot; y=&quot;&#x27; + barY + &#x27;&quot; width=&quot;&#x27; + candidateWidth.toFixed(1) + &#x27;&quot; height=&quot;8&quot; rx=&quot;4&quot;&gt;&lt;/rect&gt;&#x27;);
      });

      parts.push(&#x27;&lt;/svg&gt;&#x27;);
      host.innerHTML = parts.join(&#x27;&#x27;);
    }

    var chainState = { lengthIndex: 0, widthIndex: 0 };
    var chainLengthInput = root.querySelector(&#x27;#chain-length&#x27;);
    var chainWidthSelect = root.querySelector(&#x27;#chain-width&#x27;);
    if (chainLengthInput) chainState.lengthIndex = Number(chainLengthInput.value);
    if (chainWidthSelect) chainState.widthIndex = Math.max(0, chainWidths.indexOf(Number(chainWidthSelect.value)));

    function buildChainRail(length) {
      var shown = Math.min(length, 10);
      var pieces = [];
      for (var i = 0; i &lt; shown; i += 1) {
        pieces.push(&#x27;&lt;span class=&quot;chain-step&quot;&gt;&lt;span class=&quot;chain-chip is-select&quot;&gt;S&#x27; + (i + 1) + &#x27;&lt;/span&gt;&lt;span class=&quot;chain-arrow&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;chain-chip is-mux&quot;&gt;M&lt;/span&gt;&lt;/span&gt;&#x27;);
        if (i &lt; shown - 1) pieces.push(&#x27;&lt;span class=&quot;chain-arrow&quot;&gt;↓&lt;/span&gt;&#x27;);
      }
      if (length &gt; shown) pieces.push(&#x27;&lt;span class=&quot;chain-more text-small&quot;&gt;+&#x27; + (length - shown) + &#x27; 级&lt;/span&gt;&#x27;);
      return pieces.join(&#x27;&#x27;);
    }

    function buildChainGroups(length, groupSize) {
      var groups = [];
      var groupCount = Math.ceil(length / groupSize);
      for (var i = 0; i &lt; groupCount; i += 1) {
        var members = [];
        for (var j = 0; j &lt; groupSize; j += 1) {
          var index = i * groupSize + j;
          if (index &lt; length) members.push(&#x27;S&#x27; + (index + 1));
        }
        groups.push({ name: &#x27;G&#x27; + i, members: members });
      }
      var shownGroups = groups.slice(0, 6);
      var html = shownGroups.map(function (group) {
        return &#x27;&lt;div class=&quot;chain-group&quot;&gt;&lt;div class=&quot;chain-group-title text-small&quot;&gt;&lt;span&gt;组内优先&lt;/span&gt;&lt;span&gt;&#x27; + group.name + &#x27;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;chain-group-members&quot;&gt;&#x27; + group.members.map(function (member) { return &#x27;&lt;span class=&quot;lab-mini-chip&quot;&gt;&#x27; + member + &#x27;&lt;/span&gt;&#x27;; }).join(&#x27;&#x27;) + &#x27;&lt;/div&gt;&lt;div class=&quot;chain-or text-small&quot;&gt;组命中 = OR&lt;/div&gt;&lt;/div&gt;&#x27;;
      }).join(&#x27;&#x27;);
      if (groups.length &gt; shownGroups.length) {
        html += &#x27;&lt;div class=&quot;chain-group&quot;&gt;&lt;div class=&quot;chain-group-title text-small&quot;&gt;&lt;span&gt;其余&lt;/span&gt;&lt;span&gt;+&#x27; + (groups.length - shownGroups.length) + &#x27;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;chain-or text-small&quot;&gt;同样分组&lt;/div&gt;&lt;/div&gt;&#x27;;
      }
      return html;
    }

    function renderChain() {
      var length = chainLengths[chainState.lengthIndex];
      var width = chainWidths[chainState.widthIndex];
      var widthPosition = chainWidths.indexOf(width);
      var row = chainData[length];
      var baseline = row.baseline[widthPosition];
      var candidate = row.candidate[widthPosition];
      var reduction = baseline === 0 ? 0 : (1 - candidate / baseline) * 100;
      var groupSize = (width === 1 || length &lt; 7) ? 2 : 3;
      var protectedChain = (width === 1 &amp;&amp; length &gt; 16) || (width === 2 &amp;&amp; length &gt; 32);
      var flat = baseline === candidate;

      root.querySelector(&#x27;#chain-length-value&#x27;).textContent = String(length);
      root.querySelector(&#x27;#chain-baseline&#x27;).textContent = formatNumber(baseline);
      root.querySelector(&#x27;#chain-candidate&#x27;).textContent = formatNumber(candidate);
      root.querySelector(&#x27;#chain-reduction&#x27;).textContent = reduction === 0 ? &#x27;持平&#x27; : &#x27;−&#x27; + reduction.toFixed(1) + &#x27;%&#x27;;
      root.querySelector(&#x27;#chain-before-caption&#x27;).textContent = length + &#x27; 级逐级嵌套&#x27;;
      root.querySelector(&#x27;#chain-after-caption&#x27;).textContent = groupSize + &#x27; 路分组&#x27;;
      root.querySelector(&#x27;#chain-before&#x27;).innerHTML = buildChainRail(length);
      root.querySelector(&#x27;#chain-after&#x27;).innerHTML = buildChainGroups(length, groupSize);

      var note = length + &#x27; 级 × &#x27; + width + &#x27; 位：&#x27; + formatNumber(baseline) + &#x27; → &#x27; + formatNumber(candidate);
      if (flat) {
        note += &#x27;；这组结构持平，算法保留原结构。&#x27;;
      } else {
        note += &#x27;，结构改写后减少 &#x27; + formatNumber(baseline - candidate) + &#x27; 个单元。&#x27;;
      }
      if (protectedChain) {
        note += &#x27; 当前触发窄链保护，不做改写。&#x27;;
      }
      root.querySelector(&#x27;#chain-note&#x27;).textContent = note;
    }

    if (chainLengthInput) {
      chainLengthInput.addEventListener(&#x27;input&#x27;, function () {
        chainState.lengthIndex = Number(chainLengthInput.value);
        renderChain();
      });
    }
    if (chainWidthSelect) {
      chainWidthSelect.addEventListener(&#x27;change&#x27;, function () {
        chainState.widthIndex = chainWidths.indexOf(Number(chainWidthSelect.value));
        renderChain();
      });
    }
    renderChain();

    var ruleSelect = root.querySelector(&#x27;#rule-select&#x27;);
    var rulePanels = Array.prototype.slice.call(root.querySelectorAll(&#x27;.lab-rule-panel&#x27;));
    var rulePrev = root.querySelector(&#x27;#rule-prev&#x27;);
    var ruleNext = root.querySelector(&#x27;#rule-next&#x27;);

    function showRule(index) {
      var nextIndex = Math.max(0, Math.min(rulePanels.length - 1, index));
      rulePanels.forEach(function (panel, panelIndex) {
        panel.hidden = panelIndex !== nextIndex;
      });
      if (ruleSelect) ruleSelect.value = String(nextIndex);
      if (rulePrev) rulePrev.disabled = nextIndex === 0;
      if (ruleNext) ruleNext.disabled = nextIndex === rulePanels.length - 1;
    }

    if (ruleSelect) {
      ruleSelect.addEventListener(&#x27;change&#x27;, function () {
        showRule(Number(ruleSelect.value));
      });
    }
    if (rulePrev) {
      rulePrev.addEventListener(&#x27;click&#x27;, function () {
        showRule(Number(ruleSelect.value) - 1);
      });
    }
    if (ruleNext) {
      ruleNext.addEventListener(&#x27;click&#x27;, function () {
        showRule(Number(ruleSelect.value) + 1);
      });
    }
    showRule(0);

    var outerTabs = Array.prototype.slice.call(root.querySelectorAll(&#x27;.lab-main-tabs [role=&quot;tab&quot;]&#x27;));
    outerTabs.forEach(function (tab) {
      tab.addEventListener(&#x27;click&#x27;, function () {
        window.setTimeout(drawOfficialChart, 60);
      });
    });

    drawOfficialChart();
    if (typeof ResizeObserver === &#x27;function&#x27;) {
      var chartHost = root.querySelector(&#x27;#official-chart&#x27;);
      if (chartHost) {
        new ResizeObserver(function () {
          drawOfficialChart();
        }).observe(chartHost);
      }
    }
  })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
&lt;/script&gt;

&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
